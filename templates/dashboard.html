<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard • Desafiei</title>
    <link rel="icon" href="{{ url_for('static', filename='img/coruja.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="manifest" href="/static/manifest.json">
</head>
<body>
    <div class="container">

        <!-- CABEÇALHO DO USUÁRIO -->
        <div class="card fade-in" id="card-usuario">
            <div class="header-usuario">
                <div class="avatar-usuario" id="avatar-usuario">🦉</div>
                <div class="header-usuario-info">
                    <h2 id="nome-usuario">Carregando...</h2>
                    <p id="info-usuario">...</p>
                </div>
                <div class="header-ofensiva" title="Dias consecutivos de estudo">
                    <span class="chama">🔥</span>
                    <span id="ofensiva-valor">0</span>
                </div>
            </div>

            <div class="barra-xp-container" style="margin-top:22px">
                <div class="barra-xp-info">
                    <span>PROGRESSO PARA O PRÓXIMO ESTÁGIO</span>
                    <span class="xp-atual" id="xp-atual">0 XP</span>
                </div>
                <div class="barra-xp barra-xp-grande">
                    <div class="barra-xp-preenchida" id="barra-progresso" style="width:0%"></div>
                    <div class="barra-xp-texto" id="texto-barra">0%</div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-pill">
                    <div class="valor" id="stat-estagio">Latão I</div>
                    <div class="label">Estágio</div>
                </div>
                <div class="stat-pill">
                    <div class="valor" id="stat-xp">0</div>
                    <div class="label">XP Total</div>
                </div>
                <div class="stat-pill">
                    <div class="valor" id="stat-proximo">100</div>
                    <div class="label">Próximo em</div>
                </div>
            </div>
        </div>

        <!-- MENU DE NAVEGAÇÃO -->
        <div class="card fade-in menu-nav" style="animation-delay:0.05s;padding:10px">
            <a href="#" onclick="event.preventDefault(); transicaoBolha('/dashboard')" class="btn">📚 Desafios</a>
            <a href="#" onclick="event.preventDefault(); transicaoBolha('/ranking.html')" class="btn btn-secundario">🏆 Ranking</a>
            <a href="#" onclick="event.preventDefault(); transicaoBolha('/perfil.html')" class="btn btn-secundario">👤 Perfil</a>
            <button class="btn btn-secundario" id="btn-tema" onclick="alternarTema()" title="Alternar tema">🌙 Escuro</button>
        </div>

        <!-- RELÓGIO -->
        <div class="card fade-in" style="animation-delay:0.08s;text-align:center">
            <div class="relogio-container">
                <div class="relogio" id="relogio">--:--:--</div>
                <div class="relogio-info" id="relogio-info">Carregando...</div>
            </div>
        </div>

        <!-- CARDS DOS 7 DIAS -->
        <div id="cards-dias" class="fade-in" style="animation-delay:0.09s"></div>

        <!-- ÁREA DO DESAFIO / CONTEÚDOS -->
        <div id="area-desafio" class="fade-in" style="animation-delay:0.1s"></div>
    </div>

    <!-- Coruja -->
    <div class="coruja-guia" id="coruja-guia" title="Clique para ver o tutorial">🦉</div>
    <div class="coruja-balao" id="coruja-balao"></div>

    <!-- ============================================================
         BOTÃO FIXO DE ACESSIBILIDADE + PAINEL
         ============================================================ -->
    <div class="btn-acessibilidade" id="btn-acessibilidade"
         onclick="alternarPainelAcessibilidade(event)"
         title="Acessibilidade">♿</div>

    <div class="painel-acessibilidade" id="painel-acessibilidade">
        <h3>♿ Acessibilidade</h3>

        <div class="item-acess">
            <span>🎨 Tema</span>
            <button id="btn-tema-painel" onclick="alternarTema()">☀️ Claro</button>
        </div>

        <div class="item-acess">
            <span>🔤 Fonte</span>
            <button id="btn-fonte" onclick="ciclarFonte()">A</button>
        </div>

        <div class="item-acess">
            <span>🔲 Contraste</span>
            <button id="btn-contraste" onclick="ciclarContraste()">Normal</button>
        </div>

        <div class="item-acess item-reset">
            <button onclick="resetarAcessibilidade()">↺ Voltar ao padrão</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>    <script src="{{ url_for('static', filename='js/tema.js') }}"></script>
    <script src="{{ url_for('static', filename='js/coruja.js') }}"></script>
</body>
</html>
